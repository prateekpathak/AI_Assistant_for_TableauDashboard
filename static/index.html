<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau MCP Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@tableau/extensions-api-lib/dist/tableau.extensions.1.latest.min.js"></script>
<style>
  :root { --bg:#fff; --fg:#1f2933; --muted:#697586; --line:#dde3ea; --accent:#1f5fbf; --bubble:#eef3fa; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161b22; --fg:#e6edf3; --muted:#8b98a9; --line:#2b3441; --accent:#5b9bf0; --bubble:#212a36; }
  }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; font:14px/1.5 "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  #log { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:8px 12px; border-radius:10px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; }
  .bot { align-self:flex-start; background:var(--bubble); }
  .bot.error { border:1px solid #c0392b; }
  .hint { color:var(--muted); text-align:center; margin:auto; max-width:24em; }
  form { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); }
  input { flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:inherit; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button { padding:8px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .dots::after { content:"Thinking…"; color:var(--muted); }
</style>
</head>
<body>
<div id="log"><div class="hint" id="hint"><div style="font-size:16px;font-weight:600">Chat Bot</div> Ask about the data sources, workbooks or views on this site.</div></div>
<form id="f">
  <input id="q" autocomplete="off" placeholder="Ask a question" aria-label="Question">
  <button id="send" type="submit">Send</button>
</form>
<script>
const log = document.getElementById("log"), q = document.getElementById("q"),
      send = document.getElementById("send");
const threadId = "ext-" + Math.random().toString(36).slice(2);
let context = "";

function add(text, cls) {
  document.getElementById("hint")?.remove();
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

async function buildContext() {
  const dash = tableau.extensions.dashboardContent.dashboard;
  const sheets = dash.worksheets.map(w => w.name);
  let filters = [];
  try {
    for (const ws of dash.worksheets) {
      for (const f of await ws.getFiltersAsync()) {
        const vals = f.appliedValues ? f.appliedValues.map(v => v.formattedValue).join(", ") : "";
        filters.push(`${ws.name}: ${f.fieldName}${vals ? " = " + vals : ""}`);
      }
    }
  } catch (e) { /* filters are optional */ }
  context = `Dashboard: ${dash.name}\nWorksheets: ${sheets.join(", ")}` +
            (filters.length ? `\nActive filters: ${filters.join("; ")}` : "");
}

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const message = q.value.trim(); if (!message) return;
  q.value = ""; send.disabled = true;
  add(message, "user");
  const wait = add("", "bot dots");
  try {
    try { await buildContext(); } catch (_) {}  // refresh filters each turn
    const r = await fetch("/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message, thread_id: threadId, context})
    });
    const data = await r.json();
    wait.className = "msg bot" + (data.error ? " error" : "");
    wait.textContent = data.reply;
  } catch (err) {
    wait.className = "msg bot error";
    wait.textContent = "Could not reach the assistant backend: " + err.message;
  }
  send.disabled = false; q.focus(); log.scrollTop = log.scrollHeight;
});

tableau.extensions.initializeAsync().then(buildContext).catch(() => {
  // Opened outside Tableau (plain browser) — chat still works without context
});
</script>
</body>
</html>
